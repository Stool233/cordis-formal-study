name: Conformance

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Research stage to reproduce
        required: true
        default: study
        type: choice
        options:
          - baseline
          - conformance
          - upstream-fix
          - study
  pull_request:
    paths:
      - '.github/workflows/conformance.yml'
      - '.gitmodules'
      - 'package.json'
      - 'package-lock.json'
      - 'locks/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/cordis'
      - 'sources/deepseek-harness'
      - 'study.lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/conformance.yml'
      - '.gitmodules'
      - 'package.json'
      - 'package-lock.json'
      - 'locks/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'sources/cordis'
      - 'sources/deepseek-harness'
      - 'study.lock.json'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESEARCH_STAGE: ${{ inputs.stage || 'study' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: corepack enable
      - run: npm ci
      - run: npm run bootstrap:study
      - run: npm run "reproduce:${RESEARCH_STAGE}"
      - run: npm run verify -- --full

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-${{ env.RESEARCH_STAGE }}-evidence
          path: |
            .artifacts/stages/
            .artifacts/study-report.json
            .artifacts/study-report.md
            !.artifacts/**/cache/**
            !.artifacts/**/tlc/**
            !.artifacts/**/*.jar
          include-hidden-files: true
          if-no-files-found: warn
