name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: corepack enable
      - run: npm ci
      - run: npm run bootstrap:study
      - run: npm run reproduce:study
      - run: npm run reproduce:nightly
      - run: npm run verify -- --full
      - name: Package evidence
        run: npm run package -- --version "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: |
            dist/cordis-formal-study-*-evidence.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
